<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>京东商城首页 - 演示</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-top-row">
            <div class="logo-area">
                <span class="logo-text">特价</span>
                <span class="logo-text active">首页</span>
                <span class="logo-text">秒送</span>
                <span class="logo-text highlight">外卖</span>
                <span class="logo-text">新品</span>
            </div>
            <div class="header-right">
                <div class="ad-badge">
                    <img src="https://via.placeholder.com/20x20?text=AD" alt="ad">
                    <span>年货好"试"</span>
                    <span class="tag">1元试大牌</span>
                </div>
            </div>
        </div>

        <div class="search-bar-container">
            <div class="search-bar">
                <div class="search-icon"><i class="fas fa-search"></i></div> <!-- Fallback if image not used -->
                <div class="search-text">
                    <span class="jd-red">京东</span><span class="divider">|</span><span>2025年度账单</span>
                    <span class="tag-recommend">推荐</span>
                </div>
                <div class="camera-icon"><i class="fas fa-camera"></i></div>
                <button class="search-btn">搜索</button>
            </div>
        </div>

        <nav class="category-nav">
            <a href="#" class="nav-item active">关注</a>
            <a href="#" class="nav-item">推荐</a>
            <a href="#" class="nav-item highlight">国家补贴</a>
            <a href="#" class="nav-item">手机</a>
            <a href="#" class="nav-item">电脑办公</a>
            <a href="#" class="nav-item">数码</a>
            <a href="#" class="nav-item">分类</a>
        </nav>
    </header>

    <!-- Content Area -->
    <div class="content-scroll">
        <!-- Icon Grid -->
        <div class="icon-grid">
            <div class="grid-item">
                <div class="icon-circle red-bg"><i class="fas fa-bolt"></i></div>
                <span>秒杀</span>
            </div>
            <div class="grid-item">
                <div class="icon-circle red-bg"><i class="fas fa-truck"></i></div>
                <span>京东快递</span>
            </div>
            <div class="grid-item">
                <div class="icon-circle yellow-bg"><i class="fas fa-recycle"></i></div>
                <span>爱回收</span>
            </div>
            <div class="grid-item">
                <div class="icon-circle pink-bg"><i class="fas fa-gift"></i></div>
                <span>礼品卡</span>
            </div>
            <div class="grid-item">
                <div class="icon-circle orange-bg"><i class="fas fa-yen-sign"></i></div>
                <span>借钱</span>
            </div>
            <!-- Row 2 -->
             <div class="grid-item">
                <div class="icon-circle green-bg"><i class="fas fa-carrot"></i></div>
                <span>京东超市</span>
            </div>
             <div class="grid-item">
                <div class="icon-circle blue-bg"><i class="fas fa-tshirt"></i></div>
                <span>时尚</span>
            </div>
             <div class="grid-item">
                <div class="icon-circle purple-bg"><i class="fas fa-tv"></i></div>
                <span>家电</span>
            </div>
             <div class="grid-item">
                <div class="icon-circle teal-bg"><i class="fas fa-ticket-alt"></i></div>
                <span>充值</span>
            </div>
             <div class="grid-item">
                <div class="icon-circle red-bg"><i class="fas fa-ellipsis-h"></i></div>
                <span>更多</span>
            </div>
        </div>

        <!-- Big Cards Row -->
        <div class="big-cards-row">
            <!-- Left Card: National Subsidy -->
            <div class="big-card subsidy-card">
                <div class="card-header">
                    <h3>国家补贴 <span class="x-sign">×</span> 百亿补贴</h3>
                    <span class="tag-green">国补</span>
                </div>
                <div class="product-pair">
                    <div class="product">
                        <img src="https://via.placeholder.com/60x80?text=iPhone" alt="Product">
                        <span class="price">¥5499 补贴价</span>
                    </div>
                    <div class="product">
                        <img src="https://via.placeholder.com/60x80?text=Steam" alt="Product">
                        <span class="price">¥115.2 补贴价</span>
                    </div>
                </div>
            </div>

            <!-- Right Card: Quality Life -->
            <div class="big-card quality-card">
                <div class="card-header">
                    <h3>品质生活</h3>
                    <span class="location"><i class="fas fa-map-marker-alt"></i> 北京</span>
                </div>
                <div class="quality-grid">
                    <div class="q-item">
                        <img src="https://via.placeholder.com/30" alt="icon">
                        <span>京东七鲜</span>
                    </div>
                     <div class="q-item">
                        <img src="https://via.placeholder.com/30" alt="icon">
                        <span>买药秒送</span>
                    </div>
                     <div class="q-item">
                        <span class="tag-float">双杯2.9</span>
                        <div class="circle-icon orange">外卖</div>
                        <span>外卖</span>
                    </div>
                     <div class="q-item">
                        <img src="https://via.placeholder.com/30" alt="icon">
                        <span>京东旅行</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Medium Cards Row -->
        <div class="medium-cards-row">
            <div class="medium-card">
                <h3>9.9包邮</h3>
                <img src="https://via.placeholder.com/80x80?text=Pepsi" alt="Cola">
                <span class="price-red">¥16.38</span>
            </div>
            <div class="medium-card">
                <h3>1元特价</h3>
                <img src="https://via.placeholder.com/80x80?text=Board" alt="Tech">
                <span class="price-red">¥26.74</span>
            </div>
            <div class="medium-card">
                <h3><span class="icon-live">Il</span> 直播低价</h3>
                <img src="https://via.placeholder.com/80x80?text=Headset" alt="Headset">
                <span class="price-red">¥130.68</span>
            </div>
            <div class="medium-card">
                <h3><span class="icon-hot">Il</span> 爆品好价</h3>
                <img src="https://via.placeholder.com/80x80?text=Monitor" alt="Screen">
                <span class="price-red">¥349</span>
            </div>
        </div>

        <!-- Banner -->
        <div class="promo-banner">
            <div class="banner-content">
                <div class="banner-left">
                    <img src="https://via.placeholder.com/40x40?text=Man" class="avatar">
                    <div class="text">
                        <h4>新年购物季</h4>
                        <p>国家补贴最低5折 <i class="fas fa-chevron-right"></i></p>
                    </div>
                </div>
                <div class="banner-right">
                    <div class="banner-prod">
                        <img src="https://via.placeholder.com/40x40?text=Bat" alt="Battery">
                        <span>汽车蓄电池</span>
                    </div>
                     <div class="banner-prod">
                        <img src="https://via.placeholder.com/40x40?text=Ph" alt="Phone">
                        <span>新年换新机</span>
                    </div>
                     <div class="banner-prod">
                        <img src="https://via.placeholder.com/40x40?text=Und" alt="Wear">
                        <span>品质内衣</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feed (Just one item for demo) -->
         <div class="feed-list">
            <div class="feed-item left">
                 <img src="https://via.placeholder.com/150x200?text=PhoneCase" alt="Item">
                 <div class="feed-info">
                     <span class="tag-new">新年购物季</span>
                 </div>
            </div>
            <div class="feed-item right">
                <img src="https://via.placeholder.com/150x150?text=Laptop" alt="Item">
            </div>
        </div>

        <div style="height: 60px;"></div> <!-- Spacer for bottom bar -->
    </div>

    <!-- Bottom Tab Bar -->
    <footer class="bottom-bar">
        <div class="tab-item active">
            <div class="icon-box dog-icon"><img src="https://via.placeholder.com/30x30?text=Dog" style="border-radius: 50%;"></div>
            <span>逛</span>
        </div>
        <div class="tab-item">
            <i class="far fa-comment-dots"></i>
            <span>消息</span>
            <span class="badge">3</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-shopping-cart"></i>
            <span>购物车</span>
            <span class="badge">83</span>
        </div>
        <div class="tab-item">
            <i class="far fa-user"></i>
            <span>我的</span>
        </div>
    </footer>
</body>
</html>
